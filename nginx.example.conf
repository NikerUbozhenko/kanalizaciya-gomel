# /etc/nginx/sites-available/kanalizaciya  (замените example.by на ваш домен)
server {
    listen 80;
    server_name example.by www.example.by;
    return 301 https://example.by$request_uri;
}
server {
    listen 443 ssl http2;
    server_name example.by;
    # сертификат: sudo certbot --nginx -d example.by -d www.example.by
    ssl_certificate     /etc/letsencrypt/live/example.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.by/privkey.pem;
    client_max_body_size 20k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
